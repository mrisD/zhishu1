# Simulation-only startup margin away from elbow lower hard stops.
initial_positions:
  gripper_left_finger_joint: 0.0
  left_gripper_left_finger_joint: 0.0
  left_shoulder_pitch_joint: -0.50
  left_shoulder_roll_joint: -1.10
  left_shoulder_yaw_joint: 0.0
  left_elbow_pitch_joint: 1.50
  left_wrist_pitch_joint: 0.0
  left_wrist_roll_joint: 0.0
  left_wrist_yaw_joint: 0.0
  right_shoulder_pitch_joint: 0.0
  right_shoulder_roll_joint: 0.0
  right_shoulder_yaw_joint: 0.0
  right_elbow_pitch_joint: 0.05
  right_wrist_pitch_joint: 0.0
  right_wrist_roll_joint: 0.0
  right_wrist_yaw_joint: 0.0
  # With 320 mm fingers, a straight waist and low lift put the inner finger
  # inside the chassis. Start in the collision-checked empty-arm park posture.
  waist_up_down_joint: 0.10
  waist_pitch_joint: -0.30
  head_yaw_joint: 0.0
  head_pitch_joint: 0.0
  left_wheel_joint: 0.0
  right_wheel_joint: 0.0
