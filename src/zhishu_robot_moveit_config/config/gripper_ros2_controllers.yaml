gripper_controller_manager:
  ros__parameters:
    update_rate: 500

    gripper_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_gripper_controller:
  ros__parameters:
    joints:
      - left_gripper_left_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position

right_gripper_controller:
  ros__parameters:
    joints:
      - gripper_left_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
