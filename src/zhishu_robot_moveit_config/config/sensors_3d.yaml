sensors:
  - gemini_pro_obstacles

gemini_pro_obstacles:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /bottle_grasp/obstacle_points
  max_range: 4.0
  point_subsample: 1
  padding_offset: 0.025
  padding_scale: 1.0
  max_update_rate: 4.0
  filtered_cloud_topic: /bottle_grasp/octomap_filtered_points
