# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    # Keep ros2_control synchronized with both 1 ms EtherCAT cyclic tasks.
    update_rate: 1000  # Hz
    enforce_command_limits: true
    # Keep the manager below the EtherCAT threads (FIFO 85), but above the
    # PREEMPT_RT IRQ threads (FIFO 50) to avoid equal-priority preemption.
    thread_priority: 70
    cpu_affinity: 6
    lock_memory: true

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    body_posture_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Real-hardware controller for the three GH1 axes on TorsoHeadSystem.
    # Keep body_posture_controller for Gazebo/admittance flows that include the
    # CAN lift axis. Do not activate both overlapping controllers at once.
    torso_head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_pitch_joint
      - left_wrist_yaw_joint
      - left_wrist_pitch_joint
      - left_wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    interpolate_from_desired_state: false

right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_pitch_joint
      - right_wrist_yaw_joint
      - right_wrist_pitch_joint
      - right_wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    interpolate_from_desired_state: false


dual_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_pitch_joint
      - left_wrist_yaw_joint
      - left_wrist_pitch_joint
      - left_wrist_roll_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_pitch_joint
      - right_wrist_yaw_joint
      - right_wrist_pitch_joint
      - right_wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: true
    interpolate_from_desired_state: false
    set_last_command_interface_value_as_state_on_activation: false

body_posture_controller:
  ros__parameters:
    joints:
      - waist_up_down_joint
      - waist_pitch_joint
      - head_yaw_joint
      - head_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position


torso_head_controller:
  ros__parameters:
    joints:
      - waist_pitch_joint
      - head_yaw_joint
      - head_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    # Initial real-hardware validation uses complete three-joint goals only.
    allow_partial_joints_goal: false
    interpolate_from_desired_state: false
    set_last_command_interface_value_as_state_on_activation: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0


right_gripper_controller:
  ros__parameters:
    joints:
      - gripper_left_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position

left_gripper_controller:
  ros__parameters:
    joints:
      - left_gripper_left_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
