  planning_group: left_arm
  robot_base_frame: base_link
  end_effector_frame: L_hand_link
  sensor_frame: head_camera_optical_frame
  sensor_truth_frame: head_camera_optical_truth
  target_frame: handeye_target
  target_truth_frame: handeye_target_truth
  image_topic: /camera_head/color/image_raw
  camera_info_topic: /camera_head/color/camera_info
  head_lock:
    head_yaw_joint: 0.5
    head_pitch_joint: -0.15
    tolerance: 0.002
  charuco:
    dictionary: DICT_4X4_50
    squares_x: 7
    squares_y: 5
    square_length: 0.030
    marker_length: 0.022
    first_marker_id: 0
