quest_dual_arm_teleop:
  ros__parameters:
    bind_address: "0.0.0.0"
    tcp_port: 5005

    base_frame: "base_link"
    quest_frame: "quest_tracking"
    left_twist_topic: "/left_servo/delta_twist_cmds"
    right_twist_topic: "/right_servo/delta_twist_cmds"

    # 手柄速度到机械臂末端速度的比例。
    translation_scale: 0.35
    rotation_scale: 0.50

    # 真机首次测试必须保持低速。
    max_linear_speed: 0.06
    max_angular_speed: 0.30

    # 各手柄侧握键达到此值后，只使能对应侧机械臂。
    grip_threshold: 0.65

    # 超过该时间没有 Quest 数据，发布零速度并复位手柄状态。
    input_timeout: 0.15

    # 一阶低通滤波：越小越平滑，越大响应越快。
    filter_alpha: 0.25

    # 防止 Quest 重定位或跟踪跳变导致机械臂突动。
    max_packet_translation_jump: 0.12
    max_packet_rotation_jump: 0.70

    control_rate: 100.0
